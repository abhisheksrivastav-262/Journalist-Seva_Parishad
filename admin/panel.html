<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | जर्नलिस्ट सेवा परिषद</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1a3c;--navy2:#0d2350;--royal:#1740a8;--gold:#c9a227;--gold2:#e8cf7a;--bg:#eef1f7;--card:#fff;--line:#e2e7f2;--ink:#1a1e26;--mut:#5b6474;--ok:#1faa55;--bad:#d33;--sh:0 10px 30px -12px rgba(10,26,60,.25)}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--royal)}
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 400px at 20% 0%,#2456d633,transparent),linear-gradient(135deg,#070f26,#0d2350 60%,#1740a8)}
.login-card{background:#fff;border-radius:22px;width:min(760px,100%);display:grid;grid-template-columns:1fr 1.1fr;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.5);animation:pop .4s ease}
.login-side{background:linear-gradient(160deg,var(--navy),var(--royal));color:#fff;padding:44px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.login-side img{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid var(--gold)}
.login-side h2{margin:6px 0 0;font-size:1.35rem}.login-side p{margin:0;color:#cdd8f7;font-size:.9rem}
.login-form{padding:40px 36px}
.login-form h1{color:var(--navy);margin:0 0 4px;font-size:1.4rem}.login-form p{color:var(--mut);margin:0 0 20px}
#app{display:none}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);color:var(--navy);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);box-shadow:0 4px 18px -8px rgba(10,26,60,.25)}
.topbar b{font-size:1rem}.topbar .sp{flex:1}
.hamburger{display:none;border:0;background:var(--navy);color:#fff;width:42px;height:42px;border-radius:12px;font-size:1.2rem;cursor:pointer}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-family:inherit;cursor:pointer;font-size:.92rem;transition:.18s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn-p{background:linear-gradient(135deg,#d9b42f,#a88114);color:#fff;box-shadow:0 8px 20px -8px rgba(168,129,20,.7)}
.btn-b{background:linear-gradient(135deg,var(--royal),var(--navy2));color:#fff;box-shadow:0 8px 20px -8px rgba(23,64,168,.6)}
.btn-g{background:#eef1f7;color:var(--navy)}.btn-r{background:var(--bad);color:#fff}.btn-s{background:linear-gradient(135deg,#23b45e,#148041);color:#fff;box-shadow:0 8px 20px -8px rgba(31,170,85,.6)}
.btn-sm{padding:7px 12px;font-size:.84rem}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 59px)}
.side{background:linear-gradient(180deg,#070f26,#0d2350);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:59px;height:calc(100vh - 59px);overflow-y:auto}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:#ffffff33;border-radius:99px}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;color:#fff}
.side-brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--gold)}
.side-brand b{font-size:.95rem;line-height:1.25}.side-brand small{display:block;color:#9fb1e3;font-weight:400;font-size:.72rem}
.side a{display:block;text-decoration:none;color:#c9d4f2;font-weight:700;padding:11px 13px;border-radius:10px;font-size:.94rem;transition:.15s;border:1px solid transparent}
.side a:hover{background:#ffffff14;color:#fff}
.side a.on{background:linear-gradient(135deg,var(--royal),#2a5bff);color:#fff;border-color:#ffffff33;box-shadow:0 8px 18px -8px rgba(36,86,214,.8)}
.side .grp{font-size:.7rem;font-weight:800;letter-spacing:.1em;color:var(--gold2);padding:14px 13px 4px}
.overlay{display:none}
.main{padding:24px;max-width:1100px;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.main{padding:24px;max-width:1100px;animation:fadeUp .35s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:var(--sh)}
.card h2{margin:0 0 6px;color:var(--navy);font-size:1.25rem;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:5px;height:22px;background:linear-gradient(var(--gold),#a88114);border-radius:99px;flex:0 0 5px}
.card h3{color:var(--navy);margin:24px 0 10px}
.mut{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.stat{background:linear-gradient(135deg,var(--navy),var(--royal) 70%);color:#fff;border-radius:16px;padding:20px 18px;position:relative;overflow:hidden;box-shadow:var(--sh);transition:.2s}
.stat:hover{transform:translateY(-3px)}
.stat::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border:1px solid rgba(201,162,39,.5);border-radius:50%;pointer-events:none}
.stat b{font-size:1.9rem;display:block;color:var(--gold2)}.stat span{font-size:.85rem;opacity:.85}
label.f{display:block;font-weight:700;margin:14px 0 6px;color:var(--navy);font-size:.92rem}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcff;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px #1740a822;background:#fff}
textarea{min-height:90px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--navy);background:#f4f6fc}tr:hover td{background:#f7f9ff}
img.th{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.badge{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px;background:#eaf0ff;color:var(--royal)}
.badge.off{background:#fbe7e7;color:var(--bad)}.badge.new{background:#dff5e7;color:var(--ok)}
#roleBadge{background:linear-gradient(135deg,#d9b42f,#a88114);color:#fff}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#070f26;color:#fff;padding:13px 26px;border-radius:99px;font-weight:700;display:none;z-index:99;box-shadow:0 14px 40px rgba(0,0,0,.4);max-width:92%;border:1px solid rgba(201,162,39,.5)}
.modal{position:fixed;inset:0;background:rgba(4,8,20,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}.modal .box{background:#fff;border-radius:20px;padding:28px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 40px 100px rgba(0,0,0,.5);animation:pop .25s ease}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.media-grid figure{margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:.2s}
.media-grid figure:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.media-grid img,.media-grid video{width:100%;height:120px;object-fit:cover;display:block;background:#000}
.media-grid figcaption{font-size:.72rem;padding:8px;word-break:break-all}
.help ol li{margin-bottom:10px}
.idcard{width:340px;max-width:100%;border:2px solid var(--navy);border-radius:16px;overflow:hidden;background:#fff;color:var(--ink)}
.idcard .id-head{background:linear-gradient(135deg,var(--navy),var(--royal));color:#fff;padding:14px;display:flex;gap:10px;align-items:center}
.idcard .id-head img{width:52px;height:52px;border-radius:50%;background:#fff;object-fit:cover}
.idcard .id-body{padding:16px;display:grid;gap:6px;font-size:.9rem}
.idcard .id-photo{width:90px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .hamburger{display:block}
  .side{position:fixed;top:0;bottom:0;left:0;width:270px;z-index:60;height:100vh;border-radius:0 20px 20px 0;transform:translateX(-105%);transition:transform .3s ease;box-shadow:30px 0 60px rgba(0,0,0,.4)}
  body.nav-open .side{transform:none}
  .overlay{display:block;position:fixed;inset:0;background:rgba(4,8,20,.6);z-index:55;opacity:0;pointer-events:none;transition:.25s}
  body.nav-open .overlay{opacity:1;pointer-events:auto}
  .main{padding:14px}
  .topbar{flex-wrap:wrap}
  .login-card{grid-template-columns:1fr}
  .login-side{padding:30px 20px}
  .login-form{padding:28px 22px}
}

/* ---------- Newsroom editor ---------- */
.ed-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ed-top h2{margin:0;color:var(--navy);font-size:1.35rem}
.ed-grid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.ed-title{font-size:1.2rem;font-weight:800;padding:14px}
.upbox{border:2px dashed #b9c4e2;border-radius:14px;background:#f6f8ff;overflow:hidden}
.upbox img{width:100%;max-height:320px;object-fit:cover;display:block;background:#0a1a3c}
.upbox .up-empty{padding:44px 20px;text-align:center;color:var(--mut)}
.up-btns{display:flex;gap:8px;padding:12px;flex-wrap:wrap;background:#fff;border-top:1px solid var(--line);align-items:center}
.publish-box{position:sticky;top:80px}
.pub-row{display:flex;gap:8px;margin-top:10px}
.pub-row .btn{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;background:#f4f6fc;border-radius:10px;padding:10px 12px;font-weight:700}
.switch select{width:auto}
.count{font-size:.78rem;color:var(--mut);text-align:right}
.list-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.list-tools input[type=text]{flex:1;min-width:160px}
.lrow{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.lrow img.th{width:72px;height:72px;flex:0 0 72px}
.lrow .grow{flex:1;min-width:0}.lrow .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.ed-grid{grid-template-columns:1fr}.publish-box{position:static}}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <div class="login-side"><img src="assets/logo.jpeg" alt="JSP Logo"><h2>जर्नलिस्ट सेवा परिषद</h2><p>Website Control Panel</p></div>
    <div class="login-form">
    <h1>🔐 Admin Login</h1>
    <p>अपना username और password डालें</p>
    <label class="f">Username</label><input type="text" id="liUser" value="admin" autocomplete="username">
    <label class="f">Password</label><input type="password" id="liPass" value="admin123" autocomplete="current-password">
    <div style="margin-top:18px;display:flex;gap:10px"><button class="btn btn-b" style="flex:1" onclick="doLogin()">Login →</button></div>
    <p class="mut" style="margin:14px 0 0">Default: <b>admin / admin123</b> — पहले login पर password बदलना जरूरी है।</p>
    <p id="liErr" style="color:var(--bad);font-weight:700"></p>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <button class="hamburger" onclick="document.body.classList.toggle('nav-open')" aria-label="Menu">☰</button>
    <b>📰 JSP Admin</b><span class="badge" id="roleBadge">-</span><span class="sp"></span>
    <button class="btn btn-sm" id="apBtn" style="background:#ffffff33;color:#fff" onclick="toggleAP()">🚀 Auto: ON</button>
    <button class="btn btn-g btn-sm" onclick="window.open('/','_blank')">🌐 Site</button>
    <button class="btn btn-g btn-sm" onclick="doPreview()">👁 Preview</button>
    <button class="btn btn-p btn-sm" onclick="doPublish()">🚀 Publish</button>
    <button class="btn btn-sm" style="background:#ffffff33;color:#fff" onclick="doLogout()">Logout</button>
  </div>
  <div class="shell">
    <div class="overlay" onclick="document.body.classList.remove('nav-open')"></div>
    <nav class="side" id="sideNav" onclick="if(event.target.tagName==='A')document.body.classList.remove('nav-open')"></nav>
    <div class="main" id="view"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
let ME=null, DATA=null, USERS=[], INBOX=[], MEDIA=[];
const $=s=>document.querySelector(s);
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2800); }
async function api(url,opt={}){
  const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){ try{toast("Session खत्म — dobara login करें")}catch(_){} location.hash=""; setTimeout(()=>location.reload(),900); throw new Error("login"); }
  if(!r.ok) throw new Error(d.error||("Error "+r.status));
  return d;
}
/* ---------- auto-publish (Save = LIVE) ---------- */
let AUTOPUB=localStorage.getItem("jsp_autopub")!=="0";
function paintAP(){ const b=$("#apBtn"); if(b) b.textContent=AUTOPUB?"🚀 Auto: ON":"⏸ Auto: OFF"; }
function toggleAP(){ AUTOPUB=!AUTOPUB; localStorage.setItem("jsp_autopub",AUTOPUB?"1":"0"); paintAP(); toast(AUTOPUB?"Auto-publish ON — Save करते ही LIVE":"Auto-publish OFF — Publish दबाना होगा"); }
async function autoPub(){
  if(!AUTOPUB) return;
  try{ await api("/api/publish",{method:"POST"}); await reloadData(); toast("🎉 Website पर LIVE हो गया!"); }
  catch(e){ toast("Publish failed: "+e.message); }
}
async function doLogin(){
  try{ const d=await api("/api/login",{method:"POST",body:JSON.stringify({user:$("#liUser").value,pass:$("#liPass").value})});
    ME={user:d.user,role:d.role}; enterApp(d.mustChange);
  }catch(e){ $("#liErr").textContent=e.message; }
}
async function doLogout(){ await api("/api/logout",{method:"POST"}); location.reload(); }
async function enterApp(mustChange){
  $("#loginView").style.display="none"; $("#app").style.display="block";
  $("#roleBadge").textContent=ME.role; paintAP();
  await reloadData(); nav();
  window.addEventListener("hashchange",nav);
  setInterval(async()=>{ try{ await api("/api/me"); }catch(e){} },4*60*1000); // heartbeat: session alive rahe
  if(mustChange) openModal(`<h2>🔑 Password बदलें (जरूरी)</h2><p class="mut">पहली बार login पर नया password सेट करें।</p>
    <label class="f">पुराना password</label><input type="password" id="pwOld">
    <label class="f">नया password</label><input type="password" id="pwNew">
    <div style="margin-top:16px"><button class="btn btn-b" onclick="changePw(true)">Save →</button></div>`);
}
async function reloadData(){ try{ DATA=await api("/api/data"); }catch(e){ toast("Data load नहीं हुआ — दोबारा login करें"); setTimeout(()=>location.reload(),1500); throw e; } }
async function changePw(first){
  try{ await api("/api/password",{method:"POST",body:JSON.stringify({old:$("#pwOld").value,new:$("#pwNew").value})});
    closeModal(); toast("Password बदल गया ✓");
  }catch(e){ toast(e.message); }
}
function openModal(h){ $("#modalBox").innerHTML=h; $("#modal").classList.add("open"); }
function closeModal(){ $("#modal").classList.remove("open"); }
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

/* ---------- NAV (har page alag) ---------- */
const NAV=[
 ["home","🏠 होम"],["about","ℹ️ हमारे बारे में"],["welfare","⚖️ पत्रकार हित"],["membership","📝 सदस्यता"],
 ["activities","📅 गतिविधियां"],["news","📰 समाचार"],["gallery","🖼 मीडिया गैलरी"],["contact","📞 संपर्क"],
 ["grpM","👥 प्रबंधन"],
 ["members","🧑‍💼 सदस्य"],["notices","📣 घोषणाएं"],["donors","❤️ दानदाता"],["objectives","🎯 उद्देश्य"],["consumerpg","📄 जागरूकता पेज"],["idcard","🪪 ID कार्ड"],
 ["grp2","⚙️ SYSTEM"],
 ["ads","📢 Ads"],["donate","❤️ दान + बैंक"],["media","📁 Media"],["social","🔗 Social"],["inbox","📥 Inbox"],["users","👥 Users"],["backups","💾 Backup"],["help","❓ Help"]
];
const VIEWS={home:vHome,about:vAbout,welfare:vWelfare,membership:vMembership,news:vNewsPage,activities:vActivitiesPage,gallery:vGalleryPage,contact:vContact,members:vMembers,notices:vNotices,donors:vDonors,objectives:vObjectives,consumerpg:vConsumerPg,idcard:vIdCard,ads:vAds,donate:vDonate,media:vMedia,social:vSocial,inbox:vInbox,users:vUsers,backups:vBackups,help:vHelp};
function nav(){
  const v=(location.hash||"#home").slice(1);
  $("#sideNav").innerHTML=`<div class="side-brand"><img src="assets/logo.jpeg" alt="JSP"><b>जर्नलिस्ट सेवा परिषद<small>Admin Panel</small></b></div>`+NAV.map(n=>n[0].startsWith("grp")?`<div class="grp">${n[1]}</div>`:`<a href="#${n[0]}" class="${v===n[0]?'on':''}">${n[1]}</a>`).join("");
  const parts=v.split("/");
  if(parts[0]==="edit"){ vEditor(parts[1],parts[2]); return; }
  (VIEWS[v]||vHome)();
}
function bareInner(v,bare){
  if(!bare) return String(v??"");
  let s=String(v||"").replace(new RegExp("^<"+bare.tag+"[^>]*>"),"").replace(new RegExp("</"+bare.tag+">\\s*$"),"");
  if(bare.em) s=s.replace(/<em>(.*?)<\/em>/g,"[$1]");
  return s;
}
function bareWrap(v,bare){
  if(!bare) return v;
  let s=String(v||"");
  if(bare.em) s=s.replace(/\[(.*?)\]/g,"<em>$1</em>");
  return `<${bare.tag}${bare.attrs}>${s}</${bare.tag}>`;
}
function fld(id,val,type,label,bare){
  const raw=(val!==undefined&&val!=="")?val:"";
  const v=bareInner(raw,bare);
  return `<label class="f">${label}</label>`+((type==="textarea"||bare)?`<textarea data-f="${id}">${v.replace(/</g,"&lt;")}</textarea>`:`<input type="text" data-f="${id}" value="${v.replace(/"/g,"&quot;")}">`);
}
function fld2(k,v,label){ return `<label class="f">${label}</label><input type="text" data-k="${k}" value="${(v??"").replace(/"/g,"&quot;")}">`; }
function gFld(key,val,label){ return `<label class="f">${label}</label><input type="text" data-g="${key}" value="${(val??"").replace(/"/g,"&quot;")}">`; }
async function saveFields(){
  for(const el of document.querySelectorAll("[data-f]")){ const def=(DATA.fieldDefs.find(f=>f.id===el.dataset.f)||{}); await api("/api/save",{method:"POST",body:JSON.stringify({kind:"field",id:el.dataset.f,value:bareWrap(el.value,def.bare)})}); }
  for(const el of document.querySelectorAll("[data-g]")){ await api("/api/save",{method:"POST",body:JSON.stringify({kind:"globals",id:el.dataset.g,value:el.value})}); }
  for(const el of document.querySelectorAll("[data-seo]")){ const [f,k]=el.dataset.seo.split("|"); DATA.seo[f]=DATA.seo[f]||{}; DATA.seo[f][k]=el.value; }
  for(const f in (DATA.seo||{})) await api("/api/save",{method:"POST",body:JSON.stringify({kind:"seo",id:f,value:DATA.seo[f]})});
  await reloadData(); toast("Saved ✓"); autoPub();
}
const PAGE_FILE={Home:"index.html",About:"about.html",Welfare:"journalist-welfare.html",Membership:"membership.html",News:"news.html",Activities:"activities.html",Gallery:"gallery.html",Contact:"contact.html"};
function pageFieldsHTML(page){
  const defs=DATA.fieldDefs.filter(f=>f.page===page);
  const secs={}; defs.forEach(f=>{ (secs[f.section]=secs[f.section]||[]).push(f); });
  let h="";
    Object.keys(secs).forEach(s=>{ h+=`<h3>${s}</h3>`; secs[s].forEach(f=>{ h+=fld(f.id,f.current,f.type,f.label+` <span class="mut">(${f.file})</span>`,f.bare); }); });
  const sf=PAGE_FILE[page];
  if(sf&&DATA.seo[sf]){ h+=`<h3>🔍 SEO (${sf})</h3><label class="f">Meta title</label><input type="text" data-seo="${sf}|title" value="${(DATA.seo[sf].title||"").replace(/"/g,"&quot;")}"><label class="f">Meta description</label><textarea data-seo="${sf}|desc">${(DATA.seo[sf].desc||"").replace(/</g,"&lt;")}</textarea>`; }
  h+=`<div style="margin-top:16px"><button class="btn btn-s" onclick="saveFields()">💾 Save${AUTOPUB?" (auto-live 🚀)":""}</button></div>`;
  return h;
}

/* ---------- DASHBOARD ---------- */
function vDashboard(){
  const L=DATA.lists;

function listTableHTML(title,key,cols){
  const items=DATA.lists[key];
  const rows=items.map((it,i)=>{
    const st=it.active===false?0:1;
    const txt=((it.title||it.cap||"")+" "+(it.cat||"")+" "+(it.tag||"")).toLowerCase();
    return `<div class="lrow" data-s="${txt.replace(/"/g,"&quot;")}" data-a="${st}"><div>${imgCell(it)}</div><div class="grow"><b>${it.title||it.cap||"(बिना शीर्षक)"}</b><span class="mut">${it.cat||""} ${it.date||""}</span> <span class="badge ${st?"":"off"}">${st?"live":"draft"}</span></div><div class="rowbtns"><a class="btn btn-b btn-sm" href="#edit/${key}/${i}">✏️ Edit</a><button class="btn btn-g btn-sm" onclick="moveItem('${key}',${i},-1)">▲</button><button class="btn btn-g btn-sm" onclick="moveItem('${key}',${i},1)">▼</button><button class="btn btn-r btn-sm" onclick="delItem('${key}',${i})">Del</button></div></div>`;
  }).join("");
  return `<div class="card"><h2>${title}</h2><p class="mut">${AUTOPUB?"Save करते ही LIVE होगा 🚀":"Save के बाद Publish दबाएं"}। Order: ▲▼।</p>
  <div class="list-tools"><input type="text" placeholder="🔍 खोजें…" oninput="filterList(this)"><select onchange="filterStatus(this)"><option value="">सभी</option><option value="1">Live</option><option value="0">Draft</option></select><a class="btn btn-b btn-sm" href="#edit/${key}/new">+ नया जोड़ें</a></div>

window.filterList=function(inp){ const q=inp.value.toLowerCase(); inp.closest(".card").querySelectorAll(".lrow").forEach(r=>{ r.style.display=r.dataset.s.includes(q)?"":"none"; }); };
window.filterStatus=function(sel){ const v=sel.value; sel.closest(".card").querySelectorAll(".lrow").forEach(r=>{ r.style.display=(!v||r.dataset.a===v)?"":"none"; }); };
window.editItem=function(key,i){
  const it=i<0?{}:DATA.lists[key][i];
  const secName={leaders:"नेतृत्व",news:"समाचार",activities:"गतिविधि",gallery:"गैलरी फोटो",ads:"विज्ञापन",members:"सदस्य",notices:"घोषणा",donors:"दानदाता",objectives:"उद्देश्य",consumer:"कार्यक्रम"}[key]||key;
  openModal(`<h2>${i<0?("+ "+secName+" जोड़ें"):"Edit — "+secName}</h2><p class="mut">भरो → Save = website पर LIVE 🚀</p>${FORMS[key](it)}
  <div style="margin-top:18px;display:grid;gap:10px"><button class="btn btn-s" style="padding:15px;font-size:1.05rem" onclick="saveItem('${key}',${i})">💾 Save — LIVE करें</button><button class="btn btn-g" onclick="closeModal()">Cancel</button></div>`);
  attachImgUploads();
};
window.saveItem=async function(key,i){
  const o=i<0?{active:true}:DATA.lists[key][i];
  document.querySelectorAll("#modalBox [data-k]").forEach(el=>{ if(el.dataset.k==="catnew") return; o[el.dataset.k]=el.type==="checkbox"?el.checked:el.value; });
  const CATMAP={news:"newsCats",activities:"actCats",gallery:"galCats"};
  const cn=document.querySelector('#modalBox [data-k="catnew"]');
  if(cn&&cn.value.trim()){ o.cat=cn.value.trim().toLowerCase().replace(/\s+/g,"-"); const ck=CATMAP[key];
    if(ck&&!DATA.lists[ck].some(c=>c.value===o.cat)){ DATA.lists[ck].push({value:o.cat,label:cn.value.trim()}); await api("/api/save",{method:"POST",body:JSON.stringify({kind:"list",id:ck,value:DATA.lists[ck]})}); } }
  delete o.catnew;
  if(!o.alt) o.alt=o.title||o.cap||"";
  if(key==="news"&&i<0) o.share=o.title;
  if(key==="leaders"&&(((o.naam||"").trim()||(o.pad||"").trim()))){ o.cap=(((o.pad||"").trim()+" "+(o.naam||"").trim()).trim()); o.alt=o.cap; }
  if((key==="leaders"||key==="news"||key==="gallery")&&!o.img){ toast("📷 पहले Photo upload करें"); return; }
  if(key==="leaders"&&!((o.naam||"").trim()&&(o.pad||"").trim())&&!(o.cap||"").trim()){ toast("नाम + पद भरें"); return; }
  if((key==="news"||key==="gallery"||key==="activities")&&!((o.title||o.cap||"").trim())){ toast("Title / Caption भरें"); return; }
  if(key==="members"&&!((o.name||"").trim()&&(o.phone||"").trim())){ toast("नाम + मोबाइल भरें"); return; }
  if(key==="donors"&&!(o.name||"").trim()){ toast("नाम भरें"); return; }
  if(key==="objectives"&&!(o.text||"").trim()){ toast("उद्देश्य लिखें"); return; }
  if((key==="notices"||key==="consumer")&&!(o.title||"").trim()){ toast("Title भरें"); return; }
  if(i<0) DATA.lists[key].push(o);
  await api("/api/save",{method:"POST",body:JSON.stringify({kind:"list",id:key,value:DATA.lists[key]})});
  closeModal(); nav(); toast("Saved ✓"); autoPub();
};

function vEditor(key,idx){

  if(!item){ location.hash="#"+ED_BACK[key]; return; }
  const tname=ED_TITLES[key][0], emoji=ED_TITLES[key][1];
  $("#view").innerHTML=`
  <div class="ed-top"><a class="btn btn-g btn-sm" href="#${ED_BACK[key]}">← वापस</a><h2>${emoji} ${isNew?("नया "+tname+" जोड़ें"):(tname+" edit करें")}</h2>${(!isNew&&item.active===false)?'<span class="badge off">draft</span>':""}</div>

    <div class="pub-row"><button class="btn btn-s" onclick="saveEditor('${key}',${isNew?"-1":+idx})">💾 Save</button></div>
    <div class="pub-row"><button class="btn btn-g" onclick="previewEditor('${key}')">👁 Preview</button>${!isNew?`<button class="btn btn-r" onclick="if(confirm('Delete करें?')){delItem('${key}',${+idx});location.hash='#${ED_BACK[key]}';}">Del</button>`:""}</div>
    <p class="mut">${AUTOPUB?"Save = तुरंत LIVE 🚀":"Save के बाद Publish दबाएं"}</p></div>
  <div class="card"><h2>ℹ️ कहां दिखेगा</h2><p class="mut">${ED_WHERE[key]}</p></div></aside></div>`;
  wireEditor();
}

async function uploadFile(f, folder){
  toast("Uploading…");
  const s=await api("/api/media/sign",{method:"POST",body:JSON.stringify({name:f.name,mime:f.type||"image/jpeg",folder:folder||"gallery"})});
  const put=await fetch(s.uploadUrl,{method:"PUT",headers:{"Content-Type":f.type||"image/jpeg","x-upsert":"true"},body:f});
  if(!put.ok) throw new Error("Storage upload failed ("+put.status+")");
  const r=await api("/api/media/register",{method:"POST",body:JSON.stringify({path:s.path,key:s.key,name:f.name,mime:f.type||"image/jpeg",size:f.size||0,folder:folder||"gallery"})});
  return r;
}

function gatherEditor(key){
  const gv=id=>{ const el=$("#"+id); if(!el) return ""; return el.type==="checkbox" ? !!el.checked : (el.value||""); };
  const o={img:gv("ed-img")};
  let err="";
  const needImg=(key==="leaders"||key==="news"||key==="gallery");
  if(needImg&&!o.img) err="📷 पहले Photo लगाएं (Choose File / Library)";
  if(key==="leaders"){ o.naam=gv("ed-naam"); o.pad=gv("ed-pad"); o.full=!!gv("ed-full");
    if(o.naam&&o.pad) o.cap=o.pad+" "+o.naam; o.alt=o.cap||o.naam;
    if(!err&&!(o.naam&&o.pad)&&!o.cap) err="नाम + पद भरें"; }
  if(key==="news"){ o.cat=gv("ed-cat"); o.title=gv("ed-title"); o.tag=gv("ed-tag"); o.date=gv("ed-date"); o.desc=gv("ed-desc"); o.share=o.title; o.alt=o.title;
    if(!err&&!o.title) err="Title भरें"; }
  if(key==="activities"){ o.cat=gv("ed-cat"); o.title=gv("ed-title"); o.tag=gv("ed-tag"); o.date=gv("ed-date"); o.place=gv("ed-place"); o.desc=gv("ed-desc"); o.alt=o.title;
    if(!err&&!o.title) err="Title भरें"; }
  if(key==="gallery"){ o.cap=gv("ed-cap"); o.cat=gv("ed-cat"); o.tall=!!gv("ed-tall"); o.alt=o.cap;
    if(!err&&!o.cap) err="Caption भरें"; }
  if(key==="ads"){ o.label=gv("ed-label"); o.title=gv("ed-title"); o.text=gv("ed-text"); o.cta=gv("ed-cta"); o.href=gv("ed-href"); o.theme=gv("ed-theme");
    if(!err&&!o.title) err="Title भरें"; }
  const cn=gv("ed-catnew");
  if(cn&&cn.trim()) o._newcat=cn.trim();
  return {o:o,err:err};
}
window.saveEditor=async function(key,idx){
  const g=gatherEditor(key);
  if(g.err){ toast(g.err); return; }
  const o=g.o;
  if(o._newcat){ o.cat=o._newcat.toLowerCase().replace(/\s+/g,"-"); const ck={news:"newsCats",activities:"actCats",gallery:"galCats"}[key];
    if(ck&&!DATA.lists[ck].some(c=>c.value===o.cat)){ DATA.lists[ck].push({value:o.cat,label:o._newcat}); await api("/api/save",{method:"POST",body:JSON.stringify({kind:"list",id:ck,value:DATA.lists[ck]})}); } }
  delete o._newcat;
  o.active=(($("#ed-active")||{}).value)!=="0";
  if(idx<0){ DATA.lists[key].push(o); } else { Object.assign(DATA.lists[key][idx],o); }
  await api("/api/save",{method:"POST",body:JSON.stringify({kind:"list",id:key,value:DATA.lists[key]})});
  toast("Saved ✓"); autoPub(); location.hash="#"+ED_BACK[key];
};
window.previewEditor=function(key){
  const g=gatherEditor(key);
  if(g.err){ toast(g.err); return; }
  const o=g.o, title=o.title||o.cap||"(बिना शीर्षक)";
  const img=o.img?`<img src="/${o.img}" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px">`:`<div style="background:#0a1a3c;color:#fff;padding:40px;text-align:center;border-radius:12px">📷 कोई photo नहीं</div>`;
  openModal(`<h2>👁 Preview — website पर ऐसा दिखेगा</h2>${img}<h2 style="color:#0a1a3c;margin:12px 0 6px">${title}</h2><p style="color:#5b6474">${o.desc||o.tag||o.cat||""}</p><div style="margin-top:12px"><button class="btn btn-g" onclick="closeModal()">बंद करें</button></div>`);
};

  const u=await api("/api/media-usage?path="+encodeURIComponent(p));
  if(u.uses.length && !confirm(`⚠ Ye file in pages me use ho rahi: ${u.uses.join(", ")} — फिर भी delete?`)) return;
  await api("/api/media-delete",{method:"POST",body:JSON.stringify({path:p})});
  toast("Deleted ✓"); vMedia(); autoPub();
};

/* ---------- DIRECT IMAGE UPLOAD inside every form ---------- */
function attachImgUploads(){
  document.querySelectorAll('#modalBox input[data-k="img"]').forEach(inp=>{
    if(inp.dataset.hasUp) return; inp.dataset.hasUp="1";
    const box=document.createElement("div");
    box.style.cssText="border:2px dashed var(--royal);border-radius:12px;padding:14px;margin:10px 0;background:#f4f7ff";
    box.innerHTML=`<b>📷 Photo upload करें (Choose File)</b><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center"><input type="file" accept="image/*" style="flex:1;min-width:160px"><select style="flex:0 0 120px"><option value="gallery">gallery</option><option value="leaders">leaders</option><option value="misc">misc</option></select><button type="button" class="btn btn-b">⬆ Upload</button></div><div class="prev" style="margin-top:8px"></div>`;
    const sel=box.querySelector("select"), fi=box.querySelector('input[type="file"]'), btn=box.querySelector("button"), prev=box.querySelector(".prev");
    if(inp.value) prev.innerHTML=`<img src="${imgSrc(inp.value)}" style="max-width:100%;max-height:160px;border-radius:10px">`;
    btn.onclick=async ()=>{
      const f=fi.files[0]; if(!f){ toast("पहले Choose File से photo चुनें"); return; }
      btn.textContent="…";
      try{
        const d=await uploadFile(f,sel.value);
        inp.value=d.path; prev.innerHTML=`<img src="${imgSrc(d.path)}" style="max-width:100%;max-height:160px;border-radius:10px">`; toast("Uploaded ✓ — path भर गया");
      }catch(e){ toast(e.message); }
      btn.textContent="⬆ Upload";
    };
    inp.before(box);
  });
}

/* ---------- PLACE ON WEBSITE (upload + naam/pad → Save = LIVE) ---------- */
window.openPlace=function(p){
  const isVid=p.endsWith(".mp4");
  openModal(`<h2>➕ Website पर लगाएं</h2><p class="mut">${p}</p>
  <div style="text-align:center;margin:10px 0">${isVid?`<video src="/${p}" style="max-width:100%;max-height:200px" controls></video>`:`<img src="/${p}" style="max-width:100%;max-height:200px;border-radius:10px">`}</div>
  <label class="f">कहां लगाएं? *</label><select id="pl-sec" onchange="plFields()"><option value="leaders">🧑‍💼 नेतृत्व (Home + About)</option><option value="gallery">🖼 गैलरी</option><option value="news">📰 समाचार</option><option value="activities">📅 गतिविधियां</option></select>
  <div id="pl-fields"></div>
  <div style="margin-top:16px;display:flex;gap:10px"><button class="btn btn-s" onclick="savePlace('${p}')">💾 Save + Publish (LIVE!)</button><button class="btn btn-g" onclick="closeModal()">Cancel</button></div>`);
  plFields();
};
window.plFields=function(){
  const s=$("#pl-sec").value;
  let h=`<label class="f">नाम / Caption *</label><input type="text" id="pl-cap" placeholder="जैसे — प्रभारी ...">`;
  if(s==="news"||s==="activities"||s==="gallery"){ h+=`<label class="f">Category (english value)</label><input type="text" id="pl-cat" value="event">`; }
  if(s==="news"){ h+=`<label class="f">Tag (Hindi)</label><input type="text" id="pl-tag" value="संगठन समाचार"><label class="f">Date line</label><input type="text" id="pl-date" value="नया अपडेट"><label class="f">Description</label><textarea id="pl-desc"></textarea>`; }
  if(s==="activities"){ h+=`<label class="f">Tag (Hindi)</label><input type="text" id="pl-tag" value="कार्यक्रम"><label class="f">Date</label><input type="text" id="pl-date" value="तिथि TB*"><label class="f">Place</label><input type="text" id="pl-place" value="स्थान TB*"><label class="f">Description</label><textarea id="pl-desc"></textarea>`; }
  if(s==="leaders"){ h+=`<label class="f"><input type="checkbox" id="pl-full"> Full-frame photo (बिना कटे)?</label>`; }
  if(s==="gallery"){ h+=`<label class="f"><input type="checkbox" id="pl-tall"> Tall frame?</label>`; }
  $("#pl-fields").innerHTML=h;
};
window.savePlace=async function(p){
  const s=$("#pl-sec").value;
  const cap=(($("#pl-cap")||{}).value||"").trim();
  if(!cap){ toast("नाम / Caption भरें"); return; }
  const d=await api("/api/data");
  const item={img:p,alt:cap,active:true};
  if(s==="leaders"){ Object.assign(item,{cap:cap,full:$("#pl-full").checked,w:480,h:544}); }
  if(s==="gallery"){ Object.assign(item,{cap:cap,cat:$("#pl-cat").value||"event",tall:$("#pl-tall").checked}); }
  if(s==="news"){ Object.assign(item,{cat:$("#pl-cat").value||"event",tag:$("#pl-tag").value,title:cap,date:$("#pl-date").value,desc:$("#pl-desc").value,share:cap}); }
  if(s==="activities"){ Object.assign(item,{cat:$("#pl-cat").value||"event",tag:$("#pl-tag").value,title:cap,date:$("#pl-date").value,place:$("#pl-place").value,meta:"",desc:$("#pl-desc").value}); }
  d.lists[s].push(item);
  await api("/api/save",{method:"POST",body:JSON.stringify({kind:"list",id:s,value:d.lists[s]})});
  closeModal(); toast("Publishing… 🚀");
  try{ await api("/api/publish",{method:"POST"}); await reloadData(); toast("🎉 Website पर LIVE हो गया!"); }
  catch(e){ toast(e.message); }
};

  <label class="f">Donate QR image</label>

window.saveBank=async function(){
  const v=id=>((document.getElementById(id)||{}).value||"").trim();
  await api("/api/save",{method:"POST",body:JSON.stringify({kind:"bank",value:{upiId:v("bk-upi"),bankName:v("bk-bank"),accNo:v("bk-acc"),ifsc:v("bk-ifsc"),holder:v("bk-holder")}})}); 
  await reloadData(); toast("Saved ✓"); autoPub();
};
window.qrUpload=async function(){
  const fi=$("#qrFile"); const f=fi&&fi.files[0]; if(!f){ toast("पहले Choose File से QR चुनें"); return; }
  try{ const d=await uploadFile(f,"misc");
    $("#qrPath").value=d.path; $("#qrPrev").innerHTML=`<img src="${imgSrc(d.path)}" style="max-width:150px;border-radius:10px">`; toast("Uploaded ✓");
  }catch(e){ toast(e.message); }
};
window.saveDonate=async function(){
  const p=$("#qrPath").value.trim();
  if(p){ await api("/api/save",{method:"POST",body:JSON.stringify({kind:"field",id:"mem_qr",value:`src="${p}"`})}); }
  toast("Saved ✓"); autoPub();
};

/* ---------- INBOX ---------- */
async function vInbox(){
  INBOX=(await api("/api/inbox")).inbox;
  $("#view").innerHTML=`<div class="card"><h2>📥 Form Inbox</h2><p class="mut">${INBOX.length} entries — WhatsApp के साथ-साथ यहां भी save होते हैं। <a href="/api/inbox.csv">CSV download</a></p>
  <div style="overflow-x:auto"><table><tr><th>Date</th><th>Type</th><th>Name/Mobile</th><th>Detail</th><th>Status</th><th></th></tr>
  ${INBOX.map(i=>{ const d=i.data||{}; return `<tr><td>${new Date(i.t).toLocaleString("en-IN")}</td><td><span class="badge">${i.type}</span></td>
  <td><b>${d.name||"-"}</b><br>${d.mobile||""}${d.amount?"<br>₹"+d.amount:""}</td>
  <td style="max-width:280px">${Object.entries(d).filter(([k])=>!["name","mobile"].includes(k)).map(([k,v])=>`${k}: ${v}`).join("<br>")}</td>
  <td><select onchange="inboxStatus(${i.id},this.value)">${["new","contacted","done"].map(s=>`<option ${i.status===s?"selected":""}>${s}</option>`).join("")}</select></td>
  <td><button class="btn btn-r btn-sm" onclick="inboxDel(${i.id})">Del</button></td></tr>`; }).join("")}</table></div></div>`;
}
window.inboxStatus=async(id,s)=>{ await api("/api/inbox/"+id,{method:"PATCH",body:JSON.stringify({status:s})}); toast("Updated ✓"); };
window.inboxDel=async id=>{ if(!confirm("Delete?"))return; await api("/api/inbox/"+id,{method:"DELETE"}); vInbox(); };

/* ---------- USERS ---------- */
async function vUsers(){
  if(ME.role!=="admin"){ $("#view").innerHTML=`<div class="card"><h2>👥 Users</h2><p class="mut">सिर्फ Super Admin देख सकते हैं।</p></div>`; return; }
  USERS=(await api("/api/users")).users;
  $("#view").innerHTML=`<div class="card"><h2>👥 Users & Roles</h2>
  <table>${USERS.map(u=>`<tr><td><b>${u.user}</b></td><td>${u.role}</td><td><button class="btn btn-g btn-sm" onclick="editUser('${u.user}')">Role/Password</button></td></tr>`).join("")}</table>
  <h3>+ नया user</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="nu" placeholder="username" style="flex:1;min-width:140px"><input type="text" id="np" placeholder="password" style="flex:1;min-width:140px"><select id="nr"><option value="editor">editor</option><option value="admin">admin</option><option value="viewer">viewer</option></select><button class="btn btn-b btn-sm" onclick="saveUser(null)">Add</button></div></div>`;
}
window.editUser=u=>{ const x=USERS.find(y=>y.user===u);
  openModal(`<h2>${u}</h2><label class="f">Role</label><select id="eu-role"><option ${x.role==="admin"?"selected":""}>admin</option><option ${x.role==="editor"?"selected":""}>editor</option><option ${x.role==="viewer"?"selected":""}>viewer</option></select><label class="f">नया password (खाली = न बदलें)</label><input type="text" id="eu-pass"><div style="margin-top:14px;display:flex;gap:8px"><button class="btn btn-s" onclick="saveUser('${u}')">Save</button><button class="btn btn-r" onclick="delUser('${u}')">Delete user</button><button class="btn btn-g" onclick="closeModal()">Cancel</button></div>`); };
window.saveUser=async u=>{
  const user=u||$("#nu").value.trim(), role=u?$("#eu-role").value:$("#nr").value, pass=u?$("#eu-pass").value:$("#np").value;
  if(!user){ toast("username भरें"); return; }
  await api("/api/user-save",{method:"POST",body:JSON.stringify({user,role,pass:pass||undefined})});
  closeModal(); toast("Saved ✓"); vUsers();
};
window.delUser=async u=>{ if(!confirm(u+" को हटाएं?"))return; try{ await api("/api/user-delete",{method:"POST",body:JSON.stringify({user:u})}); closeModal(); vUsers(); }catch(e){ toast(e.message); } };

/* ---------- BACKUPS ---------- */
async function vBackups(){
  const d=await api("/api/backups"); BACKUPS=d.backups;
  $("#view").innerHTML=`<div class="card"><h2>💾 Backup & Activity</h2><p class="mut">हर Publish पर auto-backup बनता है (last 10)।</p>
  ${BACKUPS.map(b=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><span>📦 ${b}</span><span class="sp" style="flex:1"></span><button class="btn btn-g btn-sm" onclick="doRollback('${b}')">↩ Restore</button></div>`).join("")||"<p>कोई backup नहीं</p>"}
  <h3>🔑 Password बदलें</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="password" id="pwOld" placeholder="पुराना" style="flex:1;min-width:140px"><input type="password" id="pwNew" placeholder="नया" style="flex:1;min-width:140px"><button class="btn btn-b btn-sm" onclick="changePw()">Save</button></div>
  <h3>📝 Recent activity</h3><table>${d.activity.map(a=>`<tr><td>${new Date(a.t).toLocaleString("en-IN")}</td><td><b>${a.user}</b></td><td>${a.action}</td></tr>`).join("")}</table></div>`;
}
window.doRollback=async b=>{ if(!confirm(b+" restore करें? Current state backup हो जाएगा।"))return;
  await api("/api/rollback",{method:"POST",body:JSON.stringify({backup:b})}); toast("Restored ✓ — site देखें"); };

/* ---------- PUBLISH / PREVIEW ---------- */
async function doPublish(){
  if(!confirm("Publish करें? Website files update होंगी (auto-backup सहित)।")) return;
  toast("Publishing…");
  try{ const r=await api("/api/publish",{method:"POST"});
    toast(`Published ✓ ${r.changed.length} files`);
    if(r.warnings.length) openModal(`<h2>⚠ Warnings</h2><ul>${r.warnings.map(w=>`<li>${w}</li>`).join("")}</ul><button class="btn btn-g" onclick="closeModal()">OK</button>`);
    await reloadData();
  }catch(e){ toast(e.message); }
}
const HASH_FILE={home:"index.html",about:"about.html",welfare:"journalist-welfare.html",membership:"membership.html",news:"news.html",activities:"activities.html",gallery:"gallery.html",contact:"contact.html"};
function doPreview(){ const h=(location.hash||"#dashboard").slice(1); window.open("/api/preview?page="+(HASH_FILE[h]||"index.html"),"_blank"); }
